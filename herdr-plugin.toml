id = "ryutaroasada.translate"
name = "Translate"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Translate selected English text to Japanese with macOS Shortcuts or DeepL."
platforms = ["macos"]

[[actions]]
id = "translate"
title = "Translate selection to Japanese"
command = ["sh", "scripts/translate-action.sh"]

[[panes]]
id = "result"
title = "Translation"
placement = "popup"
width = "80%"
height = "60%"
command = ["sh", "scripts/translate-popup.sh"]
